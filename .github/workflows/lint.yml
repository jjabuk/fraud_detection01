name: Lint

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  quality:
    name: Ruff + Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run pytest
        run: |
          uv run pytest || rc=$?
          if [ "${rc:-0}" -eq 5 ]; then
            echo "No tests collected yet (exit code 5); treating as non-blocking for now."
            exit 0
          fi
          exit "${rc:-0}"
